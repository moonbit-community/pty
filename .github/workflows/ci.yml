name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A job takes about a minute. A pty teardown that deadlocks hangs the
    # test binary instead of failing it, so bound the job.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          # Older than Windows 11 24H2: its `ClosePseudoConsole` still waits
          # for the pseudoconsole to exit (docs/invariants.md).
          - windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Version
        run: moon version

      - name: Update registry index
        run: moon update

      - name: Check
        run: moon check --deny-warn

      - name: Verify generated interfaces
        run: moon info

      - name: Verify formatting
        run: moon fmt --check

      - name: Test
        run: moon test

      - name: Verify clean tree
        run: git diff --exit-code
